# ---------------------------------------------------------------------------
# CI for the Bomberman project.
#
# Two jobs, mirroring the structural claim the assignment cares about:
#
#   logic - builds bomberman_logic and its test suite with **no SFML
#           installed**. If a graphics header ever leaks into the game
#           rules, this job is where it stops.
#
#   game  - installs SFML and builds everything, including the playable
#           binary and the generated asset registry.
# ---------------------------------------------------------------------------
version: 2.1

jobs:
  logic:
    docker:
      - image: ubuntu:24.04
    steps:
      - checkout
      - run:
          name: Toolchain (deliberately without SFML)
          command: |
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq build-essential cmake git ca-certificates
      - run:
          name: Configure (BOMBERMAN_BUILD_VIEW=OFF - view/ and app/ are never processed)
          # This is what actually makes "no SFML installed" true: CMake's
          # configure step walks the whole CMakeLists.txt tree regardless
          # of which target is later built, so unless view/ (and
          # therefore sif_sfml) is kept out of that tree entirely, sif
          # would go and fetch-build SFML from source the moment this job
          # configures - slow, and not actually the guarantee this job
          # exists to demonstrate.
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBOMBERMAN_BUILD_VIEW=OFF
      - run:
          name: Build and run the logic tests
          command: |
            cmake --build build --target bomberman_tests -j4
            ./build/test/bomberman_tests

  game:
    docker:
      - image: ubuntu:24.04
    steps:
      - checkout
      - run:
          name: Toolchain and SFML 2.6
          command: |
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
              build-essential cmake git ca-certificates libsfml-dev
      - run:
          name: Configure
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run:
          name: Build everything
          command: cmake --build build -j4
      - run:
          name: Tests
          command: ./build/test/bomberman_tests

workflows:
  build_and_test:
    jobs:
      - logic
      - game
